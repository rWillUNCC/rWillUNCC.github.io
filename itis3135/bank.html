<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert C. “Robbie” Williams' | Remorseless Wobbegong | ITIS 3135 | Bank Management</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="stylesheet" href="styles/bank.css">
</head>
<body>
    <header> 
        <div data-include="components/header.html"></div>
    </header>
    <main>
        <h2>
            Bank Management
        </h2>
        <div class="bank-container">
            <div id="balance-display" class="balance-card">
                <h3>Current Balance</h3>
                <p id="current-balance">$0.00</p>
            </div>

            <div class="transaction-controls">
                <div class="input-group">
                    <label for="amount">Amount ($):</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="button-group">
                    <button id="deposit-btn">Deposit</button>
                    <button id="withdraw-btn">Withdraw</button>
                </div>
            </div>

            <p id="feedback" class="feedback-area"></p>

            <div class="reports">
                <div class="button-group">
                    <button id="show-deposits-btn">List Deposits</button>
                    <button id="show-withdrawals-btn">List Withdrawals</button>
                </div>
                <div id="report-output" class="report-box"></div>
            </div>
        </div>

    </main>
    <footer>
        <div data-include="components/footer.html"></div>
    </footer>

    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="scripts/bank.js"></script>
</body>
</html>
