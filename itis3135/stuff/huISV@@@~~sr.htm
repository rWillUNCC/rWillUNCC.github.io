<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crappy Design Page</title>
</head>
<body style="background-color: white; color: black;">
    
    <!-- out of order header  Papyrus-->
    <h2 style="font-family: Papyrus; margin-left: 150px;">H2 Header</h2>

    <!-- Image with removed extension, fixed dimensions (distorted), bad alt text -->
    <img src="itis3135\images\Homemade_Hot_Dogs" width="400" height="400" alt="long and bad alt text description that goes abouat a homemade hot dog but llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll">

    <!-- Irrelevant caption using a heading element -->
    <h3>i am sitting rn</h3>

    <!-- blank lines -->
    <br><br><br><br>

    <!-- Comic Sans MS, underlined nonlink, inconsistent margins -->
    <h1 style="font-family: 'Comic Sans MS'; text-decoration: underline; margin-right: 200px;">H1 Header</h1>

    <!-- centered paragraph, large font -->
    <p style="text-align: center; font-size: 32px;">
        centered paragraph with very large text.
    </p>

    <!-- centered bulleted list, serif font -->
    <ul style="text-align: center; list-style-position: inside; font-family: serif;">
        <li>Centered Item 1</li>
        <li>Centered Item 2</li>
    </ul>

    <!-- poor contrast -->
    <p style="color: #eeeeee;">extremely poor contrast against the white background.</p>

    <!-- text background color -->
    <p><span style="background-color: yellow;">a background color.</span></p>

    <!-- large border, different style per side, inconsistent margins -->
    <div style="border-top: 20px solid red; border-right: 20px dashed blue; border-bottom: 20px dotted green; border-left: 20px double purple; margin: 50px 10px 5px 100px; padding: 10px;">
        I have a very large and big border.
    </div>

    <!-- Default link colors -->
    <p><a href="../index.html">Click here for a link</a></p>
